<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Regrowth — your content, but everywhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0d0716;
    --void-2: #16101f;
    --card: #1c1428;
    --paper: #fdf9ff;
    --pink: #ff3d81;
    --lime: #c6ff3d;
    --violet: #9b6bff;
    --cyan: #3ddfff;
    --line: rgba(255,255,255,0.10);
    --text: #f4eefc;
    --text-dim: rgba(244,238,252,0.72);
    --text-faint: rgba(244,238,252,0.48);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--void); color: var(--text);
    font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden;
  }
  .blob {
    position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.35;
    pointer-events: none; z-index: 0;
  }
  .blob-1 { width: 480px; height: 480px; background: var(--pink); top: -180px; left: -140px; }
  .blob-2 { width: 420px; height: 420px; background: var(--violet); bottom: -160px; right: -120px; }
  .blob-3 { width: 300px; height: 300px; background: var(--cyan); top: 40%; left: 60%; opacity: 0.18; }

  .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 56px 24px 100px; }

  header { margin-bottom: 48px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    background: rgba(198,255,61,0.12); color: var(--lime);
    border: 1px solid rgba(198,255,61,0.35); border-radius: 20px;
    padding: 6px 14px; margin-bottom: 20px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(38px, 6.5vw, 62px); line-height: 1.02; letter-spacing: -0.02em;
    margin: 0 0 16px;
  }
  h1 .grad {
    background: linear-gradient(100deg, var(--pink), var(--violet) 55%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { font-size: 17px; color: var(--text-dim); max-width: 560px; line-height: 1.6; }

  nav.tabs {
    display: inline-flex; gap: 4px; background: var(--void-2); border: 1px solid var(--line);
    border-radius: 100px; padding: 4px; margin-bottom: 40px;
  }
  nav.tabs button {
    background: none; border: none; color: var(--text-dim);
    font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600;
    padding: 10px 22px; border-radius: 100px; cursor: pointer; transition: all .2s ease;
  }
  nav.tabs button.active { background: var(--text); color: var(--void); }
  nav.tabs button:not(.active):hover { color: var(--text); }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  textarea {
    width: 100%; min-height: 140px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.6;
    padding: 18px; resize: vertical; transition: border-color .2s ease;
  }
  textarea::placeholder { color: var(--text-faint); }
  textarea:focus { outline: none; border-color: var(--violet); }

  .btn {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px;
    background: linear-gradient(100deg, var(--pink), var(--violet));
    color: var(--paper); border: none; padding: 13px 26px; border-radius: 100px;
    cursor: pointer; transition: transform .15s ease, box-shadow .2s ease;
    box-shadow: 0 0 0 rgba(255,61,129,0);
  }
  .btn:hover { box-shadow: 0 6px 24px rgba(155,107,255,0.4); transform: translateY(-1px); }
  .btn:active { transform: scale(0.97) translateY(0); }
  .btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; transform: none; }
  .btn.ghost {
    background: none; color: var(--text); border: 1px solid var(--line);
    box-shadow: none;
  }
  .btn.ghost:hover { border-color: var(--violet); box-shadow: none; transform: none; }

  .row { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 32px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px 22px; display: flex; flex-direction: column; gap: 14px;
    opacity: 0; transform: translateY(10px) scale(0.98);
    animation: cardIn .4s ease forwards;
    border-top: 3px solid var(--accent, var(--violet));
  }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  .card-head { display: flex; justify-content: space-between; align-items: center; }
  .platform-label {
    font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; color: var(--accent, var(--violet));
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent, var(--violet)); }
  .card pre {
    white-space: pre-wrap; font-family: 'Inter', sans-serif; font-size: 13.5px;
    line-height: 1.6; margin: 0; color: rgba(244,238,252,0.88); max-height: 260px; overflow-y: auto;
  }
  .card-actions { display: flex; gap: 8px; }
  .chip {
    background: var(--void-2); border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 100px; padding: 7px 14px; font-size: 12px; font-weight: 500; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: all .15s ease;
  }
  .chip:hover { border-color: var(--violet); color: var(--text); }
  .chip.active-worked { background: rgba(198,255,61,0.15); border-color: var(--lime); color: var(--lime); }
  .chip.active-flopped { background: rgba(255,61,129,0.15); border-color: var(--pink); color: var(--pink); }

  .outcome-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 10px;
    border-radius: 100px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500;
  }
  .outcome-badge.worked { background: rgba(198,255,61,0.15); color: var(--lime); border: 1px solid rgba(198,255,61,0.4); }
  .outcome-badge.flopped { background: rgba(255,61,129,0.15); color: var(--pink); border: 1px solid rgba(255,61,129,0.4); }
  .outcome-badge.auto::after { content: ' · auto'; opacity: 0.7; }

  .publish-row { display: flex; gap: 6px; }
  .publish-row input {
    flex: 1; background: var(--void-2); border: 1px solid var(--line); border-radius: 100px;
    color: var(--text); padding: 8px 14px; font-size: 12px; font-family: 'JetBrains Mono', monospace;
  }
  .publish-row input::placeholder { color: var(--text-faint); }
  .metrics-row {
    display: flex; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-dim); flex-wrap: wrap; align-items: center;
  }
  .metrics-row .stat b { color: var(--text); font-weight: 600; }

  .profile-note {
    font-size: 13px; color: var(--text-dim); margin-top: 24px;
    background: var(--void-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; display: flex; align-items: center; gap: 10px;
  }
  .profile-note .tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase;
    background: rgba(155,107,255,0.15); color: var(--violet); padding: 3px 8px; border-radius: 100px;
    flex-shrink: 0;
  }

  .archive-form {
    display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin-bottom: 28px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
  }
  .archive-form input {
    background: var(--void-2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-size: 14px; font-family: 'Inter', sans-serif;
  }
  .archive-form input::placeholder { color: var(--text-faint); }

  .niche-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .niche-row input {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 100px;
    color: var(--text); padding: 11px 18px; font-size: 14px; font-family: 'Inter', sans-serif;
  }
  .niche-row input::placeholder { color: var(--text-faint); }

  .archive-item {
    display: flex; align-items: center; gap: 18px; padding: 18px 20px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px;
    transition: border-color .2s ease;
  }
  .archive-item:hover { border-color: var(--violet); }
  .archive-item .title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .archive-item .meta { font-size: 12px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace; }
  .archive-item .grow { flex: 1; }

  .bloom-meter { width: 130px; display: flex; flex-direction: column; gap: 5px; }
  .bloom-track { height: 7px; background: var(--void-2); border-radius: 10px; overflow: hidden; }
  .bloom-fill {
    height: 100%; border-radius: 10px;
    background: linear-gradient(90deg, var(--pink), var(--lime));
    transition: width .5s ease;
  }
  .bloom-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-faint); text-align: right; }

  .empty { color: var(--text-faint); font-size: 14px; padding: 32px 0; text-align: center; }
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--void); font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; font-size: 13px; padding: 12px 22px; border-radius: 100px;
    opacity: 0; transition: all .25s ease; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">✦ regrowth engine</div>
    <h1>your best idea,<br/><span class="grad">everywhere at once.</span></h1>
    <p class="tagline">Drop one piece of content in, get every platform's version out — and let it learn what actually pops off, so your old posts never really die.</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="repurpose">repurpose</button>
    <button class="tab-btn" data-tab="archive">archive & decay</button>
  </nav>

  <section id="panel-repurpose" class="panel active">
    <textarea id="content-input" placeholder="paste a blog post, transcript, or just the gist of what you want to say..."></textarea>
    <div class="row">
      <button class="btn" id="generate-btn">generate variants ✦</button>
      <span id="gen-status" style="font-size:13px;color:var(--text-faint);"></span>
    </div>
    <div class="profile-note" id="profile-note" style="display:none;"></div>
    <div class="cards" id="results"></div>
  </section>

  <section id="panel-archive" class="panel">
    <div class="archive-form">
      <input id="arc-title" placeholder="title or gist of the old post" />
      <input id="arc-topics" placeholder="topics (comma separated)" />
      <input id="arc-date" type="date" />
      <button class="btn ghost" id="arc-add-btn">add ＋</button>
    </div>
    <div class="niche-row">
      <input id="niche-input" placeholder="your current niche (e.g. ai, productivity)" />
      <button class="btn ghost" id="rank-btn">rank for resurfacing</button>
    </div>
    <div id="archive-list"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
const PLATFORM_META = {
  twitter:   { name: 'twitter / x thread', accent: 'var(--cyan)' },
  linkedin:  { name: 'linkedin post',       accent: 'var(--violet)' },
  instagram: { name: 'instagram caption',   accent: 'var(--pink)' },
  summary:   { name: 'summary',             accent: 'var(--lime)' },
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'archive') loadArchive();
  });
});

async function generate() {
  const content = document.getElementById('content-input').value.trim();
  if (!content) return;
  const btn = document.getElementById('generate-btn');
  const status = document.getElementById('gen-status');
  btn.disabled = true;
  status.textContent = 'generating…';

  const res = await fetch(API + '/api/posts', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content })
  });
  const data = await res.json();
  btn.disabled = false;
  status.textContent = data.usedLiveApi ? '' : 'offline mock mode — set ANTHROPIC_API_KEY for live generation';

  const note = document.getElementById('profile-note');
  if (data.profileUsed && data.profileUsed.sampleSize > 0) {
    note.style.display = 'flex';
    note.innerHTML = `<span class="tag">tuned</span> using ${data.profileUsed.sampleSize} past winning post(s): ~${data.profileUsed.avgWinningLength} words, opens with ${data.profileUsed.preferredOpening}.`;
  } else {
    note.style.display = 'none';
  }

  renderResults(data.generations);
}

function renderResults(generations) {
  const el = document.getElementById('results');
  el.innerHTML = '';
  generations.forEach((g, i) => {
    const card = renderCard(g);
    card.style.animationDelay = (i * 70) + 'ms';
    el.appendChild(card);
  });
}

function renderCard(g) {
  const meta = PLATFORM_META[g.platform] || { name: g.platform, accent: 'var(--violet)' };
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', meta.accent);
  card.innerHTML = `
    <div class="card-head">
      <span class="platform-label"><span class="dot"></span>${meta.name}</span>
      <span id="outcome-badge-${g.id}"></span>
    </div>
    <pre>${escapeHtml(g.text)}</pre>
    <div class="card-actions">
      <button class="chip" data-id="${g.id}" data-result="worked">✓ worked</button>
      <button class="chip" data-id="${g.id}" data-result="flopped">✗ flopped</button>
      <button class="chip copy-btn">copy</button>
    </div>
    <div class="publish-row">
      <input placeholder="paste live post url to publish" id="url-input-${g.id}" />
      <button class="chip publish-btn">publish</button>
    </div>
    <div id="metrics-${g.id}"></div>
  `;
  card.querySelector('.copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(g.text);
    showToast('copied to clipboard ✦');
  });
  card.querySelectorAll('[data-result]').forEach(b => {
    b.addEventListener('click', async () => {
      await fetch(API + '/api/outcomes', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ generationId: g.id, result: b.dataset.result })
      });
      card.querySelectorAll('[data-result]').forEach(x => x.classList.remove('active-worked', 'active-flopped'));
      b.classList.add(b.dataset.result === 'worked' ? 'active-worked' : 'active-flopped');
      setBadge(g.id, b.dataset.result, false);
    });
  });
  card.querySelector('.publish-btn').addEventListener('click', async () => {
    const url = document.getElementById('url-input-' + g.id).value.trim();
    if (!url) return;
    await fetch(API + `/api/generations/${g.id}/publish`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ externalUrl: url })
    });
    await syncMetrics(g.id);
  });
  return card;
}

async function syncMetrics(genId) {
  const res = await fetch(API + `/api/generations/${genId}/sync-metrics`, { method: 'POST' });
  const data = await res.json();
  if (!res.ok) { showToast(data.error); return; }

  const m = data.generation.metrics;
  const metricsEl = document.getElementById('metrics-' + genId);
  if (metricsEl) {
    metricsEl.outerHTML = `
      <div id="metrics-${genId}" class="metrics-row">
        <span class="stat">♥ <b>${m.likes}</b></span>
        <span class="stat">💬 <b>${m.comments}</b></span>
        <span class="stat">↻ <b>${m.shares}</b></span>
        <span class="stat">◎ <b>${m.views}</b></span>
        <span class="stat" style="opacity:0.6;">${data.liveConfigured ? 'live' : 'simulated'} · just synced</span>
        <button class="chip resync-btn" data-id="${genId}" style="margin-left:auto;">resync</button>
      </div>`;
    document.querySelector(`.resync-btn[data-id="${genId}"]`).addEventListener('click', () => syncMetrics(genId));
  }
  if (data.autoResult) { setBadge(genId, data.autoResult, true); showToast(`auto-tagged ${data.autoResult} ✦`); }
}

function setBadge(genId, result, auto) {
  const badge = document.getElementById('outcome-badge-' + genId);
  if (!badge) return;
  badge.innerHTML = `<span class="outcome-badge ${result}${auto ? ' auto' : ''}">${result}</span>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

document.getElementById('generate-btn').addEventListener('click', generate);

// -- Archive --
async function addArchiveItem() {
  const title = document.getElementById('arc-title').value.trim();
  const topics = document.getElementById('arc-topics').value.split(',').map(t => t.trim()).filter(Boolean);
  const date = document.getElementById('arc-date').value;
  if (!title || !date) return;
  await fetch(API + '/api/archive', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, topics, lastSharedAt: date })
  });
  document.getElementById('arc-title').value = '';
  document.getElementById('arc-topics').value = '';
  document.getElementById('arc-date').value = '';
  showToast('added to archive ✦');
  loadArchive();
}
document.getElementById('arc-add-btn').addEventListener('click', addArchiveItem);
document.getElementById('rank-btn').addEventListener('click', loadArchive);

async function loadArchive() {
  const niche = document.getElementById('niche-input').value.trim();
  const res = await fetch(API + '/api/archive/decay?niche=' + encodeURIComponent(niche));
  const items = await res.json();
  const list = document.getElementById('archive-list');
  list.innerHTML = '';
  if (items.length === 0) {
    list.innerHTML = '<div class="empty">nothing archived yet — add an old post above to see it scored.</div>';
    return;
  }
  items.forEach((item, i) => {
    const days = Math.round((Date.now() - new Date(item.lastSharedAt).getTime()) / 86400000);
    const row = document.createElement('div');
    row.className = 'archive-item';
    row.style.opacity = '0';
    row.style.animation = `cardIn .35s ease forwards`;
    row.style.animationDelay = (i * 60) + 'ms';
    row.innerHTML = `
      <div class="grow">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${item.topics.join(', ') || 'no topics'} · last shared ${days}d ago · trending ${(item.trendScore ?? 0).toFixed(2)}</div>
      </div>
      <div class="bloom-meter">
        <div class="bloom-track"><div class="bloom-fill" style="width:${Math.round(item.evergreenScore*100)}%"></div></div>
        <div class="bloom-label">evergreen ${item.evergreenScore.toFixed(2)}</div>
      </div>
      <button class="chip resurface-btn" data-id="${item.id}">resurface →</button>
    `;
    row.querySelector('.resurface-btn').addEventListener('click', async (e) => {
      e.target.textContent = '…';
      const res = await fetch(API + '/api/archive/' + item.id + '/resurface', { method: 'POST' });
      const data = await res.json();
      document.querySelector('[data-tab="repurpose"]').click();
      document.getElementById('content-input').value = item.title;
      renderResults(data.generations);
    });
    list.appendChild(row);
  });
}
</script>
</body>
</html>
